# Shared 3D GNN encoder architecture

type: "equivariant_mpnn"        # equivariant_mpnn | schnet | dmpnn | egnn

hidden_dim: 256
num_layers: 6
num_message_passing_steps: 6

# Geometry handling
use_distances: true
use_direction_vectors: true
distance_expansion:
  type: "rbf"                   # rbf | gaussian | none
  num_kernels: 64
  cutoff: 10.0

# Normalization & regularization
normalization: "layernorm"      # layernorm | batchnorm | none
dropout: 0.1
residual_connections: true

# Readout pooling
readout: "mean"                 # mean | sum | attention | set2set

# Precision / memory
use_mixed_precision: true
activation_checkpointing: true
compile_model: false            # torch.compile toggle

# Optional pretrained encoder loading
pretrained:
  enabled: false
  path: null
  freeze_backbone: false