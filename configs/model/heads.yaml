# Hierarchical task heads for multi-assay QSAR

structure: "hierarchical"        # hierarchical | flat

shared_head_dim: 256
task_head_dim: 128
num_task_layers: 2
activation: "gelu"               # relu | gelu | silu
dropout: 0.1

# Task types supported
task_types:
  regression:
    output_dim: 1
  classification:
    output_dim: 1
    apply_sigmoid: true

# Hierarchy definition
# (maps assay groups → tasks)
groups:
  physicochemical:
    type: regression
  admet:
    type: regression
  toxicity:
    type: classification

# Missing-label masking
mask_missing_labels: true